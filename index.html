<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStream Pro | Premium Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loader-container" id="loader">
    <div class="spinner"></div>
</div>

<header>
    <div class="logo"><i class="ri-netease-cloud-music-fill"></i> Vibe<span>Stream</span></div>
    <div class="mode-toggle">
        <button id="onlineMode" class="active">Online</button>
        <button id="localMode">Local</button>
    </div>
</header>

<main>
    <section class="player">
        <div class="player-card">
            <div class="disk-wrapper">
                <div class="disk" id="disk"></div>
                <div class="disk-center"></div>
            </div>

            <div class="song-info">
                <h2 id="trackTitle">Select a Track</h2>
                <p id="trackArtist">Tap to start vibes</p>
            </div>

            <canvas id="visualizer"></canvas>

            <div class="progress-area">
                <span id="currTime">0:00</span>
                <div class="slider-box">
                    <input type="range" id="progress" value="0" min="0" max="100">
                    <div class="fill" id="fillBar"></div>
                </div>
                <span id="durTime">0:00</span>
            </div>

            <div class="main-controls">
                <button id="prev"><i class="ri-skip-back-fill"></i></button>
                <button id="playPause" class="play-btn"><i class="ri-play-fill"></i></button>
                <button id="next"><i class="ri-skip-forward-fill"></i></button>
            </div>
        </div>
    </section>

    <aside class="sidebar">
        <div class="side-head">
            <h3 id="listTitle">Trending Vibes</h3>
            <input type="file" id="fileInput" multiple hidden accept="audio/*">
            <button id="addFiles" class="add-btn"><i class="ri-add-circle-line"></i> Add</button>
        </div>
        <div class="playlist" id="playlist"></div>
    </aside>
</main>

<script src="script.js"></script>
</body>
</html>
