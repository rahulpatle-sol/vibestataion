<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStream Pro | 3-Column Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <header>
        <div class="logo"><i class="ri-netease-cloud-music-fill"></i> Vibe<span>Stream</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search songs or artists...">
            <button id="searchBtn"><i class="ri-search-line"></i></button>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="icon-btn"><i class="ri-moon-line"></i></button>
        </div>
    </header>

    <main>
        <aside class="sidebar left-side">
            <h3><i class="ri-fire-line"></i> Trending</h3>
            <div id="onlinePlaylist" class="scroll-list"></div>
        </aside>

        <section class="player-center">
            <div class="player-card">
                <div class="disk-container">
                    <div class="disk" id="disk"></div>
                    <div class="disk-dot"></div>
                </div>
                <div class="song-detail">
                    <h2 id="trackTitle">Ready to Vibe?</h2>
                    <p id="trackArtist">Select a track</p>
                </div>
                <div class="controls">
                    <button id="prev"><i class="ri-skip-back-mini-fill"></i></button>
                    <button id="playPause" class="main-play"><i class="ri-play-fill"></i></button>
                    <button id="next"><i class="ri-skip-forward-mini-fill"></i></button>
                </div>
            </div>
        </section>

        <aside class="sidebar right-side">
            <h3><i class="ri-playlist-music-line"></i> My Playlist</h3>
            <button class="add-local-btn" onclick="document.getElementById('fileInput').click()">
                <i class="ri-add-line"></i> Add Local Songs
            </button>
            <input type="file" id="fileInput" multiple hidden accept="audio/*">
            <div id="localPlaylist" class="scroll-list"></div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
