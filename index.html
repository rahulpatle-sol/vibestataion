<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStream Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-wrapper">
        <aside class="sidebar">
            <div class="logo">Vibe<span>Stream</span></div>
            <div class="search-bar">
                <i class="ri-search-2-line"></i>
                <input type="text" id="searchInput" placeholder="Search vibes...">
            </div>
            <nav class="tabs">
                <button class="tab-link active" onclick="switchTab('online')"><i class="ri-fire-line"></i> Trending</button>
                <button class="tab-link" onclick="switchTab('saved')"><i class="ri-heart-3-line"></i> My Vibe</button>
            </nav>
            <div id="onlinePlaylist" class="list active"></div>
            <div id="savedPlaylist" class="list"></div>
        </aside>

        <main id="mainPlayer" class="player-container">
            <button id="minimizeBtn" class="mob-toggle"><i class="ri-arrow-down-s-line"></i></button>
            
            <div class="visualizer-overlay">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="player-content">
                <div id="disk" class="main-disk"></div>
                <div class="song-detail">
                    <h1 id="trackTitle">Ready to Vibe?</h1>
                    <p id="trackArtist">Search a song to start</p>
                </div>

                <div class="progress-box">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="seekSlider" value="0">
                    <span id="duration">0:00</span>
                </div>

                <div class="main-controls">
                    <button id="prev" class="sec-btn"><i class="ri-skip-back-fill"></i></button>
                    <button id="playPause" class="play-btn"><i class="ri-play-fill"></i></button>
                    <button id="next" class="sec-btn"><i class="ri-skip-forward-fill"></i></button>
                </div>

                <div class="volume-control">
                    <i class="ri-volume-down-line"></i>
                    <input type="range" id="volumeSlider" value="80">
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
